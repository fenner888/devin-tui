name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PTY smoke test
        run: |
          mkdir -p .snapshots
          python3 scripts/drive.py 120 36 .snapshots/ci.raw full
          npx tsx scripts/snapshot.ts .snapshots/ci.raw > .snapshots/ci.txt
          grep -Fq 'Here is what I found in the workspace:' .snapshots/ci.txt
