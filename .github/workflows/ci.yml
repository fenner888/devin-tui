name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PTY smoke test
        run: |
          mkdir -p .snapshots
          python3 scripts/drive.py 120 36 .snapshots/ci.raw full
          npx tsx scripts/snapshot.ts .snapshots/ci.raw > .snapshots/ci.txt
          grep -Fq 'Here is what I found in the workspace:' .snapshots/ci.txt
